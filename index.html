<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance Hub - Trần Bảo Nam</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
   <div class="tradingview-widget-container">
    <div class="tradingview-widget-container__widget"></div>
    <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js" async>
    {
        "symbols": [
            {
                "proName": "INDEX:VNC10",
                "title": "VN-INDEX (Proxy)"
            },
            {
                "description": "USD/VND",
                "proName": "FX_IDC:USDVND"
            },
            {
                "description": "VÀNG",
                "proName": "OANDA:XAUUSD"
            },
            {
                "description": "DẦU BRENT",
                "proName": "TVC:UKOIL"
            },
            {
                "description": "BITCOIN",
                "proName": "BITSTAMP:BTCUSD"
            }
        ],
        "showSymbolLogo": true,
        "colorTheme": "light",
        "isTransparent": false,
        "displayMode": "adaptive",
        "locale": "vi_VN"
    }
    </script>
</div>

    <header class="main-header">
        <h1><i class="fas fa-chart-line"></i> FINANCE HUB</h1>
        <p id="clock" class="time-display"></p>
    </header>

    <div class="container">
        <section class="spotlight-section">
            <div class="spotlight-card">
                <h3 class="spotlight-title"><i class="fas fa-bolt" style="color: #ffd700;"></i> TIÊU ĐIỂM NGÀNH HÔM NAY</h3>
                <div id="ai-analysis-content">
                    <p>Đang kết nối dữ liệu thị trường...</p>
                </div>
            </div>
        </section>

        <section class="news-section">
            <h2 class="section-title" style="text-align:center; margin-bottom:30px;">DÒNG THỜI SỰ TÀI CHÍNH</h2>
            <div id="news-grid" class="news-grid"></div>
        </section>

        <section class="tools-section">
            <h2 class="section-title" style="text-align:center; margin: 40px 0 20px;">CÔNG CỤ TÀI CHÍNH</h2>
            <div class="tools-flex-container">
                <div class="tool-card">
                    <h4><i class="fas fa-piggy-bank"></i> Tiết Kiệm / Lãi Vay</h4>
                    <input type="number" id="principal" placeholder="Số tiền gốc (VNĐ)">
                    <input type="number" id="rate" placeholder="Lãi suất (%/năm)">
                    <input type="number" id="months" placeholder="Kỳ hạn (tháng)">
                    <div style="display:flex; gap:10px;">
                        <button onclick="calcInterest()" style="flex:1;">Tính Lãi</button>
                        <button onclick="calcFV()" style="flex:1; background:#ffd700; color:#333;">Lãi Kép (FV)</button>
                    </div>
                </div>

                <div class="tool-card">
                    <h4><i class="fas fa-calculator"></i> Ước Tính Thuế TNCN</h4>
                    <input type="number" id="salary" placeholder="Tổng thu nhập (VNĐ)">
                    <input type="number" id="dependents" placeholder="Số người phụ thuộc">
                    <button onclick="calcTax()" style="width:100%; margin-top:54px;">Tính Thuế</button>
                </div>
            </div>
            <div id="result-box" class="result-display">Nhập số liệu để xem kết quả...</div>
        </section>

        <div class="ad-placement">
            <p class="ad-label">ADVERTISEMENT</p>
            <script async="async" data-cfasync="false" src="https://pl29416190.profitablecpmratenetwork.com/83dd9a7b5b106b6582fb804a6c412d20/invoke.js"></script>
            <div id="container-83dd9a7b5b106b6582fb804a6c412d20"></div>
        </div>
    </div>

    <footer class="footer">
        <p>Phát triển bởi <strong>Trần Bảo Nam - 2026</strong></p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
