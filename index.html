<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance Hub - Smart Tools</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button id="dark-mode-toggle" class="dark-mode-btn">🌓 Chế độ tối</button>

    <header class="main-header">
        <h1><i class="fas fa-chart-pie"></i> FINANCE HUB</h1>
        <p id="clock"></p>
    </header>

    <div class="container">
        <div class="news-tabs">
            <button class="tab-btn active" onclick="changeCategory('kinh-doanh', this)">Kinh Doanh</button>
            <button class="tab-btn" onclick="changeCategory('ebank', this)">Ngân Hàng</button>
            <button class="tab-btn" onclick="changeCategory('chung-khoan', this)">Chứng Khoán</button>
        </div>
        <div id="news-grid" class="news-grid"></div>

        <section class="tools-section">
            <h2 class="section-title">CÔNG CỤ TÀI CHÍNH</h2>
            <div class="tools-grid">
                <div class="tool-card">
                    <h4><i class="fas fa-vault"></i> Tiết Kiệm & Lãi Vay</h4>
                    <input type="number" id="principal" placeholder="Số tiền gốc (VNĐ)">
                    <input type="number" id="rate" placeholder="Lãi suất (%/năm)">
                    <input type="number" id="months" placeholder="Kỳ hạn (tháng)">
                    <div class="btn-group">
                        <button onclick="calcInterest()">Tính Lãi</button>
                        <button class="btn-alt" onclick="calcFV()">Lãi Kép</button>
                    </div>
                </div>

                <div class="tool-card">
                    <h4><i class="fas fa-file-invoice-dollar"></i> Thuế Thu Nhập</h4>
                    <input type="number" id="salary" placeholder="Tổng thu nhập (VNĐ)">
                    <input type="number" id="dependents" placeholder="Số người phụ thuộc">
                    <button class="btn-full" onclick="calcTax()">Tính Thuế TNCN</button>
                </div>

                <div class="result-container">
                    <div id="result-box" class="result-display">Kết quả hiển thị tại đây</div>
                </div>
            </div>
        </section>

        <div class="ad-placement">
            <p class="ad-label">ADVERTISEMENT</p>
            <div class="ad-container">
                <script async="async" data-cfasync="false" src="https://pl29416190.profitablecpmratenetwork.com/83dd9a7b5b106b6582fb804a6c412d20/invoke.js"></script>
                <div id="container-83dd9a7b5b106b6582fb804a6c412d20"></div>
            </div>
        </div>
    </div>

    <footer class="footer">
        <p>© 2026 Finance Hub - Developed for Community</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
