<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance Hub - Trần Bảo Nam</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="main-header" style="text-align:center; padding:40px 0; background:linear-gradient(135deg, #1a237e, #283593); color:white;">
        <h1><i class="fas fa-chart-line"></i> FINANCE HUB</h1>
        <p id="clock"></p>
    </header>

    <div class="container">
        <section class="spotlight-section">
            <div class="spotlight-card" id="spotlight-box">
                <h3 id="ai-analysis-content">Đang tải tiêu điểm...</h3>
            </div>
        </section>

        <section class="news-section">
            <h2 style="text-align:center; margin-bottom:10px;">DÒNG THỜI SỰ TÀI CHÍNH</h2>
            
            <div class="tabs-container">
                <div class="tab-group" id="time-tabs">
                    <div class="tab-item active" onclick="filterByTime('today')">Hôm nay</div>
                    <div class="tab-item" onclick="filterByTime('older')">Tin trước đó</div>
                </div>
                <br>
                <div class="tab-group" id="topic-tabs">
                    <div class="tab-item active" onclick="filterByTopic('all')">Tất cả</div>
                    <div class="tab-item" onclick="filterByTopic('chứng khoán')">Chứng khoán</div>
                    <div class="tab-item" onclick="filterByTopic('ngân hàng')">Ngân hàng</div>
                    <div class="tab-item" onclick="filterByTopic('vàng')">Vàng & Ngoại tệ</div>
                </div>
            </div>

            <div id="news-grid" class="news-grid"></div>
        </section>

        <section class="tools-section">
            <h2 style="text-align:center;">CÔNG CỤ TÀI CHÍNH</h2>
            <div class="tools-flex-container">
                <div class="tool-card">
                    <h4><i class="fas fa-piggy-bank"></i> Tiết Kiệm / Lãi Vay</h4>
                    <input type="number" id="principal" placeholder="Số tiền gốc (VNĐ)">
                    <input type="number" id="rate" placeholder="Lãi suất (%/năm)">
                    <input type="number" id="months" placeholder="Kỳ hạn (tháng)">
                    <div style="display:flex; gap:10px;">
                        <button onclick="calcInterest()" style="flex:1;">Tính Lãi</button>
                        <button onclick="calcFV()" style="flex:1; background:#ffd700; color:#333;">Lãi Kép</button>
                    </div>
                </div>

                <div class="tool-card">
                    <h4><i class="fas fa-calculator"></i> Ước Tính Thuế TNCN</h4>
                    <input type="number" id="salary" placeholder="Tổng thu nhập (VNĐ)">
                    <input type="number" id="dependents" placeholder="Số người phụ thuộc">
                    <button onclick="calcTax()" style="width:100%; margin-top:54px;">Tính Thuế</button>
                </div>
            </div>
            <div id="result-box" class="result-display">Nhập số liệu để xem kết quả...</div>
        </section>

        <div class="ad-placement">
            <script async src="https://pl29416190.profitablecpmratenetwork.com/83dd9a7b5b106b6582fb804a6c412d20/invoke.js"></script>
            <div id="container-83dd9a7b5b106b6582fb804a6c412d20"></div>
        </div>
    </div>

    <footer class="footer">
        <p>Phát triển bởi <strong>Trần Bảo Nam - 2026</strong></p>
    </footer>

    <script src="script.js"></script>
</body>
</html>s
